{% extends 'base.html' %}

{% block title %}
    {{ error_code }} | Admission Portal
{% endblock %}


{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center text-center">

            <div class="col-md-8">

                <div class="py-5">

                    <h1 class="display-1 fw-bold text-primary">
                        {{ error_code }}
                    </h1>

                    <h2 class="mb-3">
                        {{ error_title }}
                    </h2>

                    <p class="text-muted mb-4">
                        {{ error_message }}
                    </p>

                    <a href="/admission/"
                       class="btn btn-primary px-4">

                        <i class="fa-solid fa-house"></i>
                        Go Home

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
