{% extends 'base.html' %}

{% block title %}
Edit Student | Admission Portal
{% endblock %}

        <!-- Form -->

{% block content %}

<div class="card-body p-4">

            <h4 class="text-primary mb-4">
                Update Student Details
            </h4>

            <form method="POST" action="/admission/edit/{{student.id}}/">

                {% csrf_token %}

                <div class="row g-4">

                    <!-- Name -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Full Name
                        </label>

                        <input type="text"
                               name="userName"
                               class="form-control"
                               value="{{ student.name }}"
                               required>

                    </div>


                    <!-- Email -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Email Address
                        </label>

                        <input type="email"
                               name="userEmail"
                               class="form-control"
                               value="{{ student.email }}"
                               required>

                    </div>


                    <!-- Mobile -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Mobile Number
                        </label>

                        <input type="tel"
                               name="userMobile"
                               class="form-control"
                               value="{{ student.mobile }}"
                               required>

                    </div>


                    <!-- Birth Date -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Date of Birth
                        </label>

                        <input type="date"
                               name="userBirth"
                               class="form-control"
                               value="{{ student.birth|date:'Y-m-d' }}"
                               required>

                    </div>


                    <!-- Gender -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Gender
                        </label>

                        <select name="gender"
                                class="form-select"
                                required>

                            <option value="">Select Gender</option>

                            <option value="Male"
                                {% if student.gender == "Male" %}selected{% endif %}>
                                Male
                            </option>

                            <option value="Female"
                                {% if student.gender == "Female" %}selected{% endif %}>
                                Female
                            </option>

                            <option value="Other"
                                {% if student.gender == "Other" %}selected{% endif %}>
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Course -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Course
                        </label>

                        <select name="course"
                                class="form-select"
                                required>

                            <option value="">Select Course</option>

                            <option value="bca"
                                {% if student.course == "BCA" %}selected{% endif %}>
                                BCA
                            </option>

                            <option value="bba"
                                {% if student.course == "BBA" %}selected{% endif %}>
                                BBA
                            </option>

                            <option value="bsc"
                                {% if student.course == "BSC" %}selected{% endif %}>
                                BSC
                            </option>

                            <option value="mca"
                                {% if student.course == "MCA" %}selected{% endif %}>
                                MCA
                            </option>

                            <option value="mba"
                                {% if student.course == "MBA" %}selected{% endif %}>
                                MBA
                            </option>

                        </select>

                    </div>


                    <!-- Address -->
                    <div class="col-12">

                        <label class="form-label fw-bold">
                            Address
                        </label>

                        <textarea name="address"
                                  class="form-control"
                                  rows="4"
                                  required>{{ student.address }}</textarea>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="text-center mt-4">

                    <button type="submit"
                            class="btn btn-success px-4 me-2">
                        Update Student
                    </button>

                    <a href="/admission/view/{{ student.id }}/"
                       class="btn btn-secondary px-4">
                        Cancel
                    </a>

                </div>

            </form>

        </div>
{% endblock %}
